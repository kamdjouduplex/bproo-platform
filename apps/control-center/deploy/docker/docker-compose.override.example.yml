# Copy to deploy/docker/docker-compose.override.yml on the VPS

services:
  app:
    networks:
      - default
      - bproo-net
  queue:
    networks:
      - default
      - bproo-net
  scheduler:
    networks:
      - default
      - bproo-net
  web:
    ports:
      - "127.0.0.1:8094:80"
    networks:
      - default
      - proxy_net

networks:
  bproo-net:
    external: true
  proxy_net:
    external: true
