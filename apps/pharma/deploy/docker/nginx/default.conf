map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_proto $forwarded_https {
    default off;
    https   on;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

# Avoid https://domain:80 — behind Caddy, omit port 80; use 443 when TLS is terminated upstream.
map "$http_x_forwarded_proto:$http_x_forwarded_port" $forwarded_port {
    default                    $http_x_forwarded_port;
    "~^https:$"                443;
    "~^https:80$"              443;
    "~^http:$"                 $server_port;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploaded files (logos, etc.) live in app-storage — shared with php-fpm container
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $forwarded_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
